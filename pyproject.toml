[project]
name = "memory-maze"
version = "1.1.0"
description = "Memory Maze: a 3D maze benchmark for evaluating long-term memory in RL agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Jurgis Pasukonis", email = "jurgisp@gmail.com"}]
dependencies = ["dm_control>=1.0", "numpy>=1.24"]

[project.optional-dependencies]
gym = ["gym>=0.21,<1.0"]
genesis = ["genesis-world>=0.4.0", "torch>=2.0"]
gui = ["pygame", "pillow", "imageio"]
dev = ["pytest", "ruff"]

[project.urls]
Homepage = "https://github.com/jurgisp/memory-maze"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["memory_maze"]
package-data = {"memory_maze" = ["assets/*"]}
